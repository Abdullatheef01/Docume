<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Docume - AI README generator for GitHub repos and profiles</title>

    <meta
      name="description"
      content="Docume is a free AI README generator. Paste a GitHub repo link or describe your project and get a clean, professional README in seconds. Also makes GitHub profile READMEs."
    />

    <link rel="canonical" href="https://docume.co.in/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#040608" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Docume" />
    <meta property="og:url" content="https://docume.co.in/" />
    <meta
      property="og:title"
      content="Docume | Write a great README in seconds"
    />
    <meta
      property="og:description"
      content="Free AI README generator for GitHub repositories and profiles."
    />
    <meta
      property="og:image"
      content="https://docume.co.in/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Docume - AI README Generator" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Docume | Write a great README in seconds"
    />
    <meta
      name="twitter:description"
      content="Free AI README generator for GitHub repositories and profiles."
    />
    <meta
      name="twitter:image"
      content="https://docume.co.in/og-image.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
